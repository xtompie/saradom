<style>
body[modal-open]{overflow:hidden;}
dialog[modal-state]{padding:0;border:none;width:100vw;height:100vh;max-width:100vw;max-height:100vh;background:rgba(0,0,0,.6);}
dialog[modal-state]::backdrop{background:transparent;}
dialog[modal-state] [modal-frame],
dialog[modal-state] [modal-loading]{width:100%;height:100%;}
dialog[modal-state] iframe{width:100%;height:100%;border:0;background:transparent;}
[modal-loading]{display:flex;align-items:center;justify-content:center;color:#fff;gap:1rem;}
[modal-state="loading"] [modal-frame]{display:none;}
[modal-state="iframe"] [modal-loading]{display:none;}
</style>

<template modal-tpl>
  <dialog modal-state="loading">
    <div modal-loading>
      <span>Loading…</span>
      <button onclick="Modal.Cancel()">Cancel</button>
    </div>
    <div modal-frame>
      <iframe modal-iframe></iframe>
    </div>
  </dialog>
</template>

<script src="/Modal/Modal.js"></script>
