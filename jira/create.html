<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create</title>
<style>
html,body{height:100%}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#3a4048;background:transparent;display:flex;align-items:center;justify-content:center}
.card{width:520px;max-width:92vw;background:#fff;border-radius:10px;box-shadow:0 16px 48px rgba(0,0,0,.35);padding:20px 24px}
h1{margin:0 0 14px;font-size:20px;color:#1f2328}
label{display:block;margin:0 0 12px;font-size:12px;font-weight:600;color:#59636e}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:7px 10px;border:1px solid #d1d9e0;border-radius:6px;font:inherit;font-size:14px;color:#1f2328;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:0;border-color:#0969da;box-shadow:0 0 0 3px #ddf4ff}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
button{padding:6px 14px;border:1px solid #d1d9e0;border-radius:6px;background:#fff;font:inherit;font-weight:500;color:#1f2328;cursor:pointer}
.primary{background:#0969da;border-color:#0969da;color:#fff}
</style>
<script src="js/App.js"></script>
<script src="js/Ui/Modal.js"></script>
</head>
<body onkeydown="App.Ui.Modal.Esc(event)">
  <form class="card" onsubmit="event.preventDefault(); App.Ui.Modal.Result({ key: 'SCRUM-24', summary: this.summary.value.trim() || 'Untitled' })">
    <h1>Create</h1>
    <label>Project<select><option>My Team (SCRUM)</option></select></label>
    <label>Work type<select><option>Task</option><option>Bug</option><option>Story</option><option>Epic</option></select></label>
    <label>Summary<input name="summary" type="text" placeholder="What needs to be done?" autofocus></label>
    <label>Description<textarea rows="3" placeholder="Add more detail…"></textarea></label>
    <div class="foot">
      <button type="button" onclick="App.Ui.Modal.Cancel()">Cancel</button>
      <button type="submit" class="primary">Create</button>
    </div>
  </form>
</body>
</html>
