<span class="edit-view field-val" field-labels="{{value}}" hx-post="fragments/field-labels-edit.html" hx-fill hx-target="this" hx-swap="outerHTML" hx-vals-body="() => ({ value: this.attr('field-labels') })" onclick="App.Ui.Hx(this, event)"><s-init run="() => { const v = this.attr('field-labels').trim(); const names = v === 'None' ? [] : v.split(',').map(s => s.trim()).filter(Boolean); this.classList.toggle('set', !!names.length); if (!names.length) { this.textContent = 'None'; return; } this.replaceChildren(...names.map(n => { const c = document.createElement('span'); c.className = 'label-chip'; c.textContent = n; return c; })); }"></s-init></span>
