<div class="watch-panel" watch-space>
<s-compute run="() => this.nall('watch-count', this.all('[watcher]').length)">
<div class="watch-self" watch-self>
<button class="menu-item" hx-get="" hx-post="fragments/watchers-unwatch.html" hx-target="closest [watch-self]" hx-swap="innerHTML" onclick="App.Ui.Hx(this)"><svg class="ic"><use href="#i-eye"/></svg> Stop watching <kbd class="kbd">W</kbd></button>
</div>
<div class="menu-sep"></div>
<div class="menu-head"><span watch-count="(n) => { const t = n + (n === 1 ? ' watcher' : ' watchers'); if (this.textContent !== t) this.textContent = t; }">2 watchers</span></div>
<div class="watch-list" watch-list>
<div class="watcher" watcher watch-me watcher-name="Sam Rivera"><div class="avatar sm">SR</div> Sam Rivera <button class="linkish sm watch-remove" hx-get="" hx-post="fragments/watchers-unwatch.html" hx-target="closest [watch-space] [watch-self]" hx-swap="innerHTML" onclick="App.Ui.Hx(this)">Remove</button></div>
<div class="watcher" watcher watcher-name="Alex Kim"><div class="avatar sm">AK</div> Alex Kim <button class="linkish sm watch-remove" hx-get="" hx-post="fragments/watchers-remove.html" hx-target="closest [watcher]" hx-swap="outerHTML" onclick="App.Ui.Hx(this)">Remove</button></div>
</div>
<div class="menu-sep"></div>
<form class="watch-add" hx-get="" hx-post="fragments/watchers-add.html" hx-target="closest [watch-space] [watch-list]" hx-swap="append" onsubmit="App.Ui.Hx(this, event)">
<input type="text" placeholder="Add people" aria-label="Add people">
<button type="submit" class="btn-add"><svg class="ic"><use href="#i-plus"/></svg> Add</button>
</form>
</s-compute>
</div>
