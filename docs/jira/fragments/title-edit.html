<span class="edit-wrap"><input class="edit-input" type="text" value="{{value}}" hx-post="fragments/title-show.html" hx-fill hx-target="closest .edit-wrap" hx-swap="outerHTML" hx-vals-body="() => ({ value: this.value.trim() || '{{value}}' })" onkeydown="if (event.key === 'Enter') { event.preventDefault(); App.Ui.Hx(this, event); } else if (event.key === 'Escape') { event.preventDefault(); App.Ui.Hx(this.up('.edit-wrap').one('.edit-cancel'), event); }" onblur="App.Ui.Hx(this, event)"><span class="edit-ctrls" onmousedown="event.preventDefault()"><button type="button" class="edit-ctrl edit-ok" title="Confirm" hx-post="fragments/title-show.html" hx-fill hx-target="closest .edit-wrap" hx-swap="outerHTML" hx-vals-body="() => ({ value: this.up('.edit-wrap').one('input').value.trim() || '{{value}}' })" onclick="App.Ui.Hx(this, event)">&#10003;</button><button type="button" class="edit-ctrl edit-cancel" title="Cancel" hx-post="fragments/title-show.html" hx-fill hx-target="closest .edit-wrap" hx-swap="outerHTML" hx-vals-body="() => ({ value: '{{value}}' })" onclick="App.Ui.Hx(this, event)">&#10005;</button></span><s-init run="() => { const i = this.one('input'); i.focus(); i.select && i.select(); }"></s-init></span>
