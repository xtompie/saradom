<span class="edit-wrap"><input class="edit-input" type="{{type}}" value="{{value}}" hx-post="fragments/field-show.html" hx-fill hx-target="closest .edit-wrap" hx-swap="outerHTML" hx-vals-body="() => { const v = this.value.trim() || 'None'; return { value: v, type: '{{type}}', set: v !== 'None' ? 'set' : '', state: v.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') }; }" onkeydown="if (event.key === 'Enter') { event.preventDefault(); App.Ui.Hx(this, event); } else if (event.key === 'Escape') { event.preventDefault(); App.Ui.Hx(this.up('.edit-wrap').one('.edit-cancel'), event); }" onblur="App.Ui.Hx(this, event)"><span class="edit-ctrls" onmousedown="event.preventDefault()"><button type="button" class="edit-ctrl edit-ok" title="Confirm" hx-post="fragments/field-show.html" hx-fill hx-target="closest .edit-wrap" hx-swap="outerHTML" hx-vals-body="() => { const v = this.up('.edit-wrap').one('input').value.trim() || 'None'; return { value: v, type: '{{type}}', set: v !== 'None' ? 'set' : '', state: v.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') }; }" onclick="App.Ui.Hx(this, event)">&#10003;</button><button type="button" class="edit-ctrl edit-cancel" title="Cancel" hx-post="fragments/field-show.html" hx-fill hx-target="closest .edit-wrap" hx-swap="outerHTML" hx-vals-body="() => ({ value: '{{value}}', type: '{{type}}', set: '{{set}}', state: '{{state}}' })" onclick="App.Ui.Hx(this, event)">&#10005;</button></span><s-init run="() => { const i = this.one('input'); i.focus(); i.select && i.select(); }"></s-init></span>
